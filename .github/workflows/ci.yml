name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "true"

defaults:
  run:
    working-directory: libs/skillvet

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group test
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format --check
        run: uv run ruff format src tests --diff

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group test
      - name: Unit tests
        run: uv run pytest tests/unit_tests -q
      - name: Integration tests (real deepagents backends, no network)
        run: uv run pytest tests/integration_tests -q

  # Guards the headline number in the README so it cannot silently rot.
  corpus:
    name: Corpus false-positive check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group test
      - name: Clone SkillsBench corpus
        run: git clone --depth 1 https://github.com/benchflow-ai/skillsbench.git /tmp/skillsbench
      - name: Assert clean rate stays >= 94%
        run: uv run python scripts/corpus_check.py /tmp/skillsbench/tasks --min-clean 0.94
